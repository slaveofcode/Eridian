<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Eridian logo: a crystalline "brain" core inside a segmented mineral
       exoskeleton, on a dark rounded app tile (transparent corners → macOS
       squircle). Palette: tile #11151D→#0B0E14, coral #E8825A, core green #3ECF8E. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11151D"/>
      <stop offset="1" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0A588"/>
      <stop offset="0.55" stop-color="#E8825A"/>
      <stop offset="1" stop-color="#B5623E"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8DF5C6"/>
      <stop offset="0.45" stop-color="#3ECF8E"/>
      <stop offset="1" stop-color="#3ECF8E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded app tile (corners outside stay transparent) -->
  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#tile)"/>
  <rect x="3" y="3" width="506" height="506" rx="111" fill="none" stroke="#1E2430" stroke-width="2"/>

  <!-- mark, inset with padding so it sits nicely within the tile -->
  <g transform="translate(58,58) scale(0.773)">
    <!-- exoskeleton: 6 symmetric plates of a pointy-top hex, cracked at vertices -->
    <g fill="none" stroke="#7A4B34" stroke-width="13" stroke-linecap="round" opacity="0.92">
      <path d="M268.5 103.2 L382.5 168.8"/>
      <path d="M395 190.4 L395 321.6"/>
      <path d="M382.5 343.2 L268.5 408.8"/>
      <path d="M243.5 408.8 L129.5 343.2"/>
      <path d="M117 321.6 L117 190.4"/>
      <path d="M129.5 168.8 L243.5 103.2"/>
    </g>
    <!-- exoskeleton vertex nodes -->
    <g fill="#E8825A" opacity="0.9">
      <circle cx="256" cy="96" r="9"/>
      <circle cx="395" cy="176" r="9"/>
      <circle cx="395" cy="336" r="9"/>
      <circle cx="256" cy="416" r="9"/>
      <circle cx="117" cy="336" r="9"/>
      <circle cx="117" cy="176" r="9"/>
    </g>
    <!-- inner accretion ring -->
    <polygon points="256,136 360,196 360,316 256,376 152,316 152,196"
             fill="none" stroke="#E8825A" stroke-width="5" stroke-linejoin="round" opacity="0.6"/>

    <!-- crystalline brain core -->
    <g>
      <circle cx="256" cy="262" r="70" fill="url(#core)"/>
      <polygon points="256,166 337,213 337,309 256,356 175,309 175,213" fill="url(#crystal)"/>
      <g stroke="#0B0E14" stroke-width="3.5" stroke-linejoin="round" opacity="0.85" fill="none">
        <polygon points="256,214 297,238 297,286 256,310 215,286 215,238"/>
        <line x1="256" y1="166" x2="256" y2="214"/>
        <line x1="337" y1="213" x2="297" y2="238"/>
        <line x1="337" y1="309" x2="297" y2="286"/>
        <line x1="256" y1="356" x2="256" y2="310"/>
        <line x1="175" y1="309" x2="215" y2="286"/>
        <line x1="175" y1="213" x2="215" y2="238"/>
      </g>
      <polygon points="256,166 337,213 256,214" fill="#FBD9C9" opacity="0.55"/>
      <circle cx="256" cy="262" r="15" fill="#8DF5C6"/>
      <circle cx="256" cy="262" r="15" fill="none" stroke="#0B0E14" stroke-width="2.5" opacity="0.5"/>
    </g>
  </g>
</svg>
